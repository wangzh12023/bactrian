name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.14+7d59c7ec9'
          core-version: '0.10.14+7d59c7ec9'
      - name: Toolchain and registry
        run: |
          moon version --all
          moon update
      - name: Check (wasm and js, warnings are errors)
        run: |
          moon check --deny-warn
          moon check --target js --deny-warn
      - name: Test (wasm)
        run: moon test
      - name: Test (js)
        run: moon test --target js
      - name: Format
        run: moon fmt --check
      - name: Public interfaces are up to date
        if: runner.os == 'Linux'
        run: |
          moon info
          git diff --exit-code -- '*.mbti'
      - name: Offline demo
        run: moon run cmd/bactrian -- demo
      - name: Policy file check
        run: moon run cmd/bactrian -- policy examples/banking.policy
      - name: A policy with a misspelt argument is refused
        shell: bash
        run: |
          printf 'policy "typo"\neffect send_money audience recipient\n  require trusted(recipeint) : "x"\n' > typo.policy
          if moon run cmd/bactrian -- policy typo.policy; then
            echo "expected a non-zero exit status"; exit 1
          fi
      - name: Embedding example
        run: moon run examples/embed

  playground:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.14+7d59c7ec9'
          core-version: '0.10.14+7d59c7ec9'
      - name: Build the playground
        run: |
          moon update
          moon build web --target js --release
          mkdir -p site
          cp web/static/index.html web/static/style.css site/
          cp _build/js/release/build/web/web.js site/playground.js
          # The deployed bundle contains third-party code and AgentDojo data:
          # ship the licenses and notices with it.
          cp LICENSE NOTICE site/
          cp -r third_party site/third_party
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: playground
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
